name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Test
        run: dotnet test tests/RimForce.Tests -c Release --logger "trx;LogFileName=tests.trx"

      - name: Publish RimForce.exe (self-contained, single file, win-x64)
        run: dotnet publish src/RimForce.App/RimForce.App.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish

      - name: Smoke test the real exe on Windows (--selftest, no force feedback)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish/RimForce.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA/RimForce/selftest.txt"
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md publish/
          Copy-Item docs/ON-DEVICE-CHECKLIST.md publish/
          Get-ChildItem publish | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: RimForce-win-x64
          path: |
            publish/RimForce.exe
            publish/README.md
            publish/ON-DEVICE-CHECKLIST.md
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/tests.trx'

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/RimForce.exe
            publish/ON-DEVICE-CHECKLIST.md

  linux-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Core + safety tests (no Windows dependencies)
        run: dotnet test tests/RimForce.Tests -c Release
